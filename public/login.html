<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — 🐔 Chicken Check-In</title>
    <link rel="icon" href="/gfx/cci-favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/gfx/cci-favicon.png" />
    <meta property="og:image" content="https://chickencheckin.netlify.app/gfx/cci-favicon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://chickencheckin.netlify.app/gfx/cci-favicon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nhsuk-frontend@10.4.2/dist/nhsuk/nhsuk-frontend.min.css" />
    <link rel="stylesheet" href="/app.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      .login-page {
        min-height: 100vh;
        background-size: cover;
        background-position: center;
        background-color: #005eb8;
        display: flex;
        flex-direction: column;
      }

      .login-page__overlay {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        background: rgba(0, 0, 0, 0.55);
        padding: 10vh 16px 24px;
        gap: 0;
      }

      .login-page__title {
        color: #fff;
        font-size: clamp(1.75rem, 5vw, 3rem);
        font-weight: 700;
        text-align: center;
        margin: 0 0 32px;
        padding: 0 16px;
        line-height: 1.2;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }

      .login-page__card {
        background: #fff;
        border-radius: 6px;
        padding: 32px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      }

      .login-page__card .nhsuk-form-group {
        margin-bottom: 20px;
      }
      .login-page__card .nhsuk-button {
        width: 100%;
        margin-bottom: 0;
      }

      .login-page__footer {
        text-align: center;
        padding: 16px;
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.65);
      }

      .login-page__footer a {
        color: rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="login-page" id="login-page">
      <div class="login-page__overlay">
        <h1 class="login-page__title">🐔<br />Chicken Check-In</h1>
        <p style="color: #fff; text-align: center; margin: 0 0 24px; padding: 0 16px; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4)">
          Habit tracking for people who hate tracking habits and/or love chickens. <a href="/about.html" style="color: rgba(255,255,255,0.85)">Learn more</a>
        </p>

        <div class="login-page__card">
          <div id="error-banner" class="nhsuk-error-summary" aria-labelledby="error-title" role="alert" style="display: none; margin-bottom: 20px">
            <h2 class="nhsuk-error-summary__title" id="error-title">There was a problem</h2>
            <div class="nhsuk-error-summary__body"><p id="error-message" style="margin: 0"></p></div>
          </div>

          <!-- Sign in form -->
          <form id="signin-form" novalidate>
            <h2 class="nhsuk-heading-m" style="margin-bottom: 20px">Sign in</h2>
            <div class="nhsuk-form-group">
              <label class="nhsuk-label" for="signin-email">Email address</label>
              <input class="nhsuk-input" id="signin-email" type="email" autocomplete="email" />
            </div>
            <div class="nhsuk-form-group">
              <label class="nhsuk-label" for="signin-password">Password</label>
              <input class="nhsuk-input" id="signin-password" type="password" autocomplete="current-password" />
            </div>
            <button class="nhsuk-button" type="submit" id="signin-btn">Sign in</button>
            <p class="nhsuk-body" style="margin-top: 16px; margin-bottom: 0; text-align: center">
              Not got an account? <a href="#" id="tab-signup" class="nhsuk-link">Create one</a>
            </p>
          </form>

          <!-- Create account form -->
          <form id="signup-form" style="display: none" novalidate>
            <h2 class="nhsuk-heading-m" style="margin-bottom: 20px">Create account</h2>
            <div class="nhsuk-form-group">
              <label class="nhsuk-label" for="signup-firstname">First name</label>
              <input class="nhsuk-input" id="signup-firstname" type="text" autocomplete="given-name" />
            </div>
            <div class="nhsuk-form-group">
              <label class="nhsuk-label" for="signup-email">Email address</label>
              <input class="nhsuk-input" id="signup-email" type="email" autocomplete="email" />
            </div>
            <div class="nhsuk-form-group">
              <label class="nhsuk-label" for="signup-password">Password</label>
              <div class="nhsuk-hint" id="signup-password-hint">At least 6 characters</div>
              <input class="nhsuk-input" id="signup-password" type="password" autocomplete="new-password" aria-describedby="signup-password-hint" />
            </div>
            <div class="nhsuk-form-group">
              <label class="nhsuk-label" for="signup-password2">Confirm password</label>
              <input class="nhsuk-input" id="signup-password2" type="password" autocomplete="new-password" />
            </div>
            <button class="nhsuk-button" type="submit" id="signup-btn">Create account</button>
            <p class="nhsuk-body" style="margin-top: 16px; margin-bottom: 0; text-align: center">
              <a href="#" id="tab-signin" class="nhsuk-link">Already have an account? Sign in</a>
            </p>
          </form>
        </div>

        <p class="login-page__footer" style="margin-top: 12px">v104 &middot; 2 Jun 2026</p>
        <p class="login-page__footer"><a href="mailto:steve@molesworth.me">Questions or support</a></p>
      </div>
    </div>

    <script type="module" src="/login.js"></script>
  </body>
</html>
