<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in saved — 🐔 Chicken Check-In</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nhsuk-frontend@10.4.2/dist/nhsuk/nhsuk-frontend.min.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="nhsuk-header" role="banner">
    <div class="nhsuk-width-container">
      <div class="nhsuk-header__content">
        <div class="nhsuk-header__logo">
          <span class="nhsuk-header__link nhsuk-header__link--service-name">🐔 Chicken Check-In</span>
        </div>
      </div>
    </div>
  </header>

  <div class="nhsuk-width-container">
    <main class="nhsuk-main-wrapper" id="maincontent">
      <div class="nhsuk-grid-row">
        <div class="nhsuk-grid-column-two-thirds">

          <div class="nhsuk-panel nhsuk-panel--confirmation" style="margin-bottom:32px">
            <h1 class="nhsuk-panel__title" id="celebration-heading">Well done!</h1>
            <div class="nhsuk-panel__body" id="status-message">Check-in recorded</div>
          </div>

          <div class="nhsuk-card" id="mood-card" style="display:none;margin-bottom:24px">
            <div class="nhsuk-card__content">
              <h2 class="nhsuk-heading-s" style="margin-bottom:8px">Overall mood rating</h2>
              <p class="app-score" id="mood-value" style="margin-bottom:4px">—</p>
              <p class="app-score-label" id="mood-delta"></p>
            </div>
          </div>

          <nav class="app-nav" style="margin-top:24px">
            <a href="/" id="edit-link">Edit this check-in</a>
            <a href="/reports.html">View reports</a>
          </nav>

        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/confirmation.js"></script>
</body>
</html>
