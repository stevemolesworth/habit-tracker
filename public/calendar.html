<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — 🐔 Chicken Check-In</title>
    <link rel="icon" href="/gfx/cci-favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/gfx/cci-favicon.png" />
    <meta property="og:image" content="https://chickencheckin.netlify.app/gfx/cci-favicon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://chickencheckin.netlify.app/gfx/cci-favicon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nhsuk-frontend@10.4.2/dist/nhsuk/nhsuk-frontend.min.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="app-global-header">
    <div class="nhsuk-width-container">
      <div class="app-global-header__inner">
        <a href="/" class="app-global-header__title">🐔 <span class="app-global-header__title-text">Chicken Check-In</span></a>
        <nav class="app-global-header__nav" aria-label="Main navigation">
          <a href="/"><span class="material-icons app-btn-icon" aria-hidden="true">add_circle</span><span class="app-btn-label">Check-in</span></a>
          <a href="/calendar.html"><span class="material-icons app-btn-icon" aria-hidden="true">calendar_today</span><span class="app-btn-label">Calendar</span></a>
          <a href="/reports.html"><span class="material-icons app-btn-icon" aria-hidden="true">bar_chart</span><span class="app-btn-label">Reports</span></a>
          <a href="/settings.html" id="nav-settings-link"><span class="material-icons app-btn-icon" aria-hidden="true">settings</span><span class="app-btn-label">Settings</span></a>
          <a href="/account.html" id="nav-account-link" style="display:none"><span class="material-icons app-btn-icon" aria-hidden="true">person</span><span class="app-btn-label">—</span></a>
          <button type="button" id="nav-logout-btn" class="app-nav-signout" style="display:none"><span class="material-icons app-btn-icon" aria-hidden="true">logout</span><span class="app-btn-label">Sign out</span></button>
        </nav>
      </div>
    </div>
  </header>

  <div class="nhsuk-width-container">
    <main class="nhsuk-main-wrapper" id="maincontent">
      <div class="nhsuk-grid-row">
        <div class="nhsuk-grid-column-full">

          <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px">
            <button class="nhsuk-button nhsuk-button--secondary" id="prev-month" style="margin:0">&#8249;</button>
            <h1 class="nhsuk-heading-l" id="month-label" style="margin:0;flex:1;text-align:center"></h1>
            <button class="nhsuk-button nhsuk-button--secondary" id="next-month" style="margin:0">&#8250;</button>
          </div>

          <!-- Calendar grid -->
          <div class="app-calendar" id="calendar-grid">
            <div class="app-calendar__header">Mon</div>
            <div class="app-calendar__header">Tue</div>
            <div class="app-calendar__header">Wed</div>
            <div class="app-calendar__header">Thu</div>
            <div class="app-calendar__header">Fri</div>
            <div class="app-calendar__header">Sat</div>
            <div class="app-calendar__header">Sun</div>
          </div>

          <!-- Day detail panel -->
          <div id="day-detail" class="nhsuk-u-margin-top-4" style="display:none">
            <h2 class="nhsuk-heading-m" id="day-detail-title"></h2>
            <div id="day-detail-content"></div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <footer class="nhsuk-footer" role="contentinfo">
    <div class="nhsuk-width-container">
      <h2 class="nhsuk-u-visually-hidden">Support links</h2>
      <ul class="nhsuk-footer__list">
        <li class="nhsuk-footer__list-item"><a class="nhsuk-footer__list-item-link" href="/about.html">About</a></li>
        <li class="nhsuk-footer__list-item"><a class="nhsuk-footer__list-item-link" href="/settings.html">Settings</a></li>
        <li class="nhsuk-footer__list-item"><a class="nhsuk-footer__list-item-link" href="/account.html">Manage account</a></li>
        <li class="nhsuk-footer__list-item"><a class="nhsuk-footer__list-item-link" href="/calendar.html">Calendar</a></li>
        <li class="nhsuk-footer__list-item"><a class="nhsuk-footer__list-item-link" href="/reports.html">Reports</a></li>
        <li class="nhsuk-footer__list-item" id="admin-footer-item" style="display:none"><a class="nhsuk-footer__list-item-link" href="/admin.html">Admin</a></li>
      </ul>
      <p class="nhsuk-footer__copyright">&copy; Chicken Check-In 2026</p>
    </div>
  </footer>

  <script type="module" src="/calendar.js"></script>
</body>
</html>
